<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARV | Plataforma Premium</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root{
      --bg:#000000;
      --card:#141414;
      --soft:#1f1f1f;
      --text:#fff;
      --muted:#9ca3af;
      --red:#e50914;
      --gold:#c7a45b;
      --nav-bg:linear-gradient(180deg,rgba(12,12,12,.85),#000);
      --nav-border:rgba(255,255,255,.05);
      --nav-text:#a5a5a5;
      --nav-active:#fff;
      --border:rgba(255,255,255,.1);
    }
    body.light{
      --bg:#f5f5f6;
      --card:#ffffff;
      --soft:#f1f1f1;
      --text:#111827;
      --muted:#6b7280;
      --nav-bg:linear-gradient(180deg,rgba(255,255,255,.85),#f5f5f6);
      --nav-border:rgba(0,0,0,.08);
      --nav-text:#6b7280;
      --nav-active:#111827;
      --border:rgba(0,0,0,.08);
    }

    *{margin:0;padding:0;box-sizing:border-box;font-family:'Montserrat',sans-serif;}
    body{background:var(--bg);color:var(--text);padding-bottom:90px;min-height:100vh;overflow-x:hidden;transition:.3s;}

    .screen{display:none;min-height:100vh;animation:fadeIn .25s ease;}
    .screen.active{display:block;}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}

    .login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#000;}
    .login-box{width:100%;max-width:360px;background:var(--card);border-radius:18px;padding:30px;box-shadow:0 12px 40px rgba(0,0,0,.45);border:1px solid var(--soft);text-align:center;}
    .login-box h1{margin-bottom:18px;font-weight:900;letter-spacing:.5px;color:var(--red);font-size:32px;}
    .login-box input{width:100%;padding:14px;margin-bottom:12px;background:#000;border:1px solid #333;border-radius:10px;color:#fff;}
    .login-box button{width:100%;padding:14px;background:var(--red);border:none;border-radius:10px;color:#fff;font-weight:800;cursor:pointer;}

    .app-header{padding:20px 16px 6px;display:flex;align-items:center;justify-content:space-between;}
    .app-title{font-size:24px;font-weight:900;color:var(--red);}
    .header-actions{display:flex;align-items:center;gap:12px;}
    .icon-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;cursor:pointer;}

    .search-bar{padding:0 16px 10px;display:none;}
    .search-bar.is-open{display:block;}
    .search-input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-weight:600;}

    .filters-container{padding:10px 16px;overflow-x:auto;scrollbar-width:none;}
    .filters-container::-webkit-scrollbar{display:none;}
    .filters-row{display:flex;gap:10px;white-space:nowrap;}
    .filter{padding:8px 16px;border:1px solid transparent;border-radius:20px;font-size:13px;cursor:pointer;color:var(--muted);transition:.2s;background:var(--soft);font-weight:700;}
    .filter.active{border-color:var(--red);color:var(--red);}

    .hero{position:relative;margin:10px 16px 18px;border-radius:16px;overflow:hidden;background:#111;height:250px;}
    .hero img{width:100%;height:100%;object-fit:cover;opacity:.7;}
    .hero-info{position:absolute;left:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;}
    .hero-title{font-size:26px;font-weight:900;}
    .primary-btn{border:none;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer;background:#fff;color:#000;}

    .section{padding:22px 0 16px 16px;}
    .section-title{font-size:17px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:10px;}
    .section-title::before{content:"";width:3px;height:18px;background:var(--red);border-radius:10px;}
    .carousel{display:flex;gap:10px;overflow-x:auto;padding-right:20px;scrollbar-width:none;}
    .carousel::-webkit-scrollbar{display:none;}

    .card{flex:0 0 115px;position:relative;border-radius:4px;overflow:hidden;cursor:pointer;transition:transform .2s ease;background:var(--soft);aspect-ratio:2/3;}
    .card:hover{transform:scale(1.03);}
    .card img{width:100%;height:100%;object-fit:cover;display:block;}
    .card-placeholder{width:100%;height:100%;display:grid;place-items:center;background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.16));color:var(--text);font-size:11px;font-weight:700;padding:8px;text-align:center;}
    .card-options-btn{position:absolute;bottom:5px;right:5px;background:rgba(0,0,0,0.5);border-radius:50%;padding:4px;display:grid;place-items:center;}

    .detail-view{position:fixed;inset:0;background:var(--bg);z-index:1100;overflow-y:auto;display:none;padding-bottom:50px;}
    .hero-banner{width:100%;aspect-ratio:16/9;position:relative;}
    .hero-banner img{width:100%;height:100%;object-fit:cover;}
    .hero-close{position:absolute;top:20px;right:20px;background:rgba(0,0,0,0.6);border-radius:50%;padding:8px;z-index:10;cursor:pointer;}
    .hero-play{position:absolute;top:50%;left:50%;transform:translate(-50%, -50%);background:rgba(0,0,0,0.5);border:2px solid #fff;border-radius:50%;padding:15px;cursor:pointer;}

    .episode-list-container{padding:20px;}
    .season-selector{display:flex;align-items:center;gap:8px;font-weight:800;margin-bottom:20px;background:#262626;padding:8px 12px;border-radius:4px;width:fit-content;}
    .episode-item{margin-bottom:25px;}
    .ep-main{display:flex;align-items:center;gap:15px;margin-bottom:10px;}
    .ep-thumb{width:130px;aspect-ratio:16/9;position:relative;border-radius:4px;overflow:hidden;flex-shrink:0;cursor:pointer;}
    .ep-thumb img{width:100%;height:100%;object-fit:cover;}
    .ep-thumb .ep-placeholder{width:100%;height:100%;display:grid;place-items:center;background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.2));color:var(--text);font-size:22px;}
    .ep-play-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.2);}
    .ep-title{font-size:14px;font-weight:800;margin-bottom:2px;}
    .ep-meta{font-size:12px;color:var(--muted);}

    .arv-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:2000;display:none;}
    .arv-bottom-sheet{position:fixed;bottom:0;left:0;width:100%;background:#222;border-radius:15px 15px 0 0;z-index:2001;padding:20px;transform:translateY(100%);transition:.3s;}
    .arv-sheet-active{transform:translateY(0);}
    .arv-sheet-option{display:flex;align-items:center;gap:15px;padding:15px 0;color:#eee;font-weight:600;font-size:14px;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer;}

    .player{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:2200;display:none;align-items:center;justify-content:center;}
    .player.active{display:flex;}
    .player video{width:min(100vw,980px);max-height:90vh;background:#000;border-radius:10px;}
    .player-close{position:absolute;top:20px;left:16px;z-index:2201;background:rgba(255,255,255,.12);padding:6px;border-radius:999px;cursor:pointer;color:#fff;display:grid;place-items:center;}

    .bottom{position:fixed;bottom:0;left:0;width:100%;height:74px;background:var(--nav-bg);backdrop-filter:blur(10px);display:flex;justify-content:space-around;align-items:center;z-index:999;border-top:1px solid var(--nav-border);}
    .nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--nav-text);cursor:pointer;font-weight:600;}
    .nav-item.active{color:var(--nav-active);}
    .home-fab{position:fixed;right:18px;bottom:96px;padding:12px 16px;border:none;border-radius:999px;background:var(--red);color:#fff;font-weight:800;box-shadow:0 12px 24px rgba(0,0,0,.35);cursor:pointer;display:flex;align-items:center;gap:8px;z-index:1000;}

    .profile{padding:30px;}
    .profile-header{display:flex;gap:16px;align-items:center;}
    .profile-header img{width:90px;height:90px;border-radius:50%;border:3px solid var(--gold);object-fit:cover;background:var(--soft);}
    .profile-btn{margin-top:14px;padding:16px;background:var(--card);border-radius:14px;cursor:pointer;color:var(--text);border:1px solid var(--soft);}
  </style>
</head>
<body>
  <div id="login" class="screen active">
    <div class="login">
      <div class="login-box">
        <h1>ARV</h1>
        <input id="email" type="email" placeholder="Email" value="usuario@arv.com">
        <input id="password" type="password" placeholder="Senha" value="123456">
        <button onclick="login()">Entrar</button>
      </div>
    </div>
  </div>

  <div id="home" class="screen">
    <div class="app-header">
      <div>
        <div class="app-title">Para <span id="welcome"></span></div>
        <small style="color:var(--muted);font-weight:600;">Módulo</small>
      </div>
      <div class="header-actions">
        <div class="icon-btn" onclick="toggleTheme()"><i data-lucide="sun"></i></div>
        <div class="icon-btn" onclick="toggleSearchBar()"><i data-lucide="search"></i></div>
      </div>
    </div>

    <div class="search-bar" id="searchBar">
      <input id="globalSearch" class="search-input" type="search" placeholder="Pesquisar episódios e títulos" oninput="filterCatalogBySearch()">
    </div>

    <div class="filters-container">
      <div class="filters-row" id="filtersRow">
        <div class="filter active" onclick="filterContent('inicio', this)">Início</div>
        <div class="filter" onclick="filterContent('Modalidade', this)">Modalidade</div>
        <div class="filter" onclick="filterContent('categorias', this)">Categorias</div>
        <div class="filter" onclick="filterContent('novidades', this)">Novidades</div>
      </div>
    </div>

    <div id="main-content">
      <div class="hero">
        <img src="imagens/lifestyle/01EBFB7A-B8A8-456E-8B95-A9267B1F51C9.png" alt="Destaque" onerror="this.style.display='none'">
        <div class="hero-info">
          <div class="hero-title">Método ARV</div>
          <button class="primary-btn" onclick="openPlayer('cont-04', 'ep-1')">Assistir</button>
        </div>
      </div>
      <div id="sections-container"></div>
    </div>

    <button class="home-fab" onclick="returnHome()"><span>Início</span></button>
  </div>

  <div id="perfil" class="screen">
    <div class="profile">
      <div class="profile-header">
        <img id="avatar" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==" alt="Avatar">
        <div>
          <h2 id="profileName"></h2>
          <p>Membro Premium</p>
        </div>
      </div>
      <div class="profile-btn" onclick="logout()">Sair</div>
    </div>
  </div>

  <div id="detail-view" class="detail-view">
    <div class="hero-banner">
      <img id="detail-hero-img" src="" alt="">
      <div class="hero-close" onclick="closeDetails()"><i data-lucide="x" color="white"></i></div>
      <div class="hero-play" onclick="openPlayer(selectedItem?.id, 'ep-1')"><i data-lucide="play" color="white" fill="white" size="32"></i></div>
    </div>

    <div class="episode-list-container">
      <h2 id="detail-title" style="font-size:24px;margin-bottom:10px;"></h2>
      <div class="search-bar" style="padding:0 0 16px;display:block;">
        <input id="episodeSearch" class="search-input" type="search" placeholder="Pesquisar episódios" oninput="filterEpisodes()">
      </div>
      <div class="season-selector">
        Temporada 1 <i data-lucide="chevron-down" size="18"></i>
      </div>
      <div id="episodes-container"></div>
    </div>
  </div>

  <div id="player" class="player">
    <div class="player-close" onclick="closePlayer()"><i data-lucide="x" size="28"></i></div>
    <video id="v-vid" controls></video>
  </div>

  <div class="arv-overlay" id="sheetOverlay" onclick="closeSheet()"></div>
  <div class="arv-bottom-sheet" id="sheet">
    <div class="arv-sheet-option" onclick="closeSheet()"><i data-lucide="plus"></i>Adicionar à lista</div>
    <div class="arv-sheet-option" onclick="closeSheet()"><i data-lucide="download"></i>Baixar</div>
    <div class="arv-sheet-option" onclick="closeSheet()"><i data-lucide="x"></i>Fechar</div>
  </div>

  <div class="bottom" id="bottom-nav" style="display:none">
    <div class="nav-item active" onclick="showScreen('home', this)"><i data-lucide="home"></i><span>Início</span></div>
    <div class="nav-item"><i data-lucide="clapperboard"></i><span>Módulos</span></div>
    <div class="nav-item" onclick="showScreen('perfil', this)"><i data-lucide="user"></i><span>Perfil</span></div>
  </div>

  <script>
    const episodeVideoPool = [
      "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",
      "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4",
      "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4"
    ];

    const catalogByCategory = {
      inicio: [
        { id: "cont-01", title: "Exploding Kittens", img: "imagens/lifestyle/1A367628-73EA-4CAD-86F7-F4ECCDB64FAF.png" },
        { id: "cont-02", title: "Stranger Things", img: "imagens/lifestyle/5D3ECED7-4E97-4D34-8887-4AFAD2BD6710.png" },
        { id: "cont-04", title: "Elite ARV", img: "imagens/lifestyle/8AC5165D-345E-4F63-B362-037D2E872DDD.png" }
      ],
      jogos: [{ id: "jogos-01", title: "Lifestyle Pack", img: "imagens/lifestyle/1FBDB744-36A8-492F-A025-5B007EFDA360.png" }],
      humor: [{ id: "humor-01", title: "Doc Mentalidade", img: "imagens/documentario/F48EB169-B8B0-40B5-9E87-1F9612536648.png" }],
      japoneses: [{ id: "jpn-01", title: "Variedades", img: "imagens/milionario/0D83D8EA-B9C3-4C63-B396-9071B504C539.png" }],
      escolhas: [{ id: "escolhas-01", title: "Pack Feminino", img: "imagens/mulher/02C5947F-2B7E-4298-8215-E3AF0C434118.png" }],
      ficcao: [{ id: "ficcao-01", title: "ABSOLUTE", img: "imagens/homem/2D41BF59-383C-4CDE-9450-4125BA7F8800.png" }]
    };

    const categories = [
      { id: "inicio", title: "Continuar assistindo", type: "inicio" },
      { id: "jogos", title: "Pacotes Lifestyle", type: "Modalidade" },
      { id: "humor", title: "Documentários", type: "Modalidade" },
      { id: "japoneses", title: "Desenvolvimento Pessoal", type: "categorias" },
      { id: "escolhas", title: "Pack Feminino", type: "novidades" },
      { id: "ficcao", title: "ABSOLUTE", type: "categorias" }
    ];

    const episodeMapByItem = {};
    let selectedItem = null;
    let activeFilter = "inicio";

    function buildEpisodeMap() {
      Object.values(catalogByCategory).flat().forEach(item => {
        episodeMapByItem[item.id] = Array.from({ length: 10 }, (_, index) => ({
          id: `ep-${index + 1}`,
          title: `Episódio ${index + 1}`,
          url: episodeVideoPool[index % episodeVideoPool.length]
        }));
      });
    }

    function safeImageTag(item) {
      if (!item.img) return `<div class="card-placeholder">${item.title}</div>`;
      return `<img src="${item.img}" alt="${item.title}" onerror="this.outerHTML='<div class=\\"card-placeholder\\">${item.title}</div>'">`;
    }

    function login() {
      const email = document.getElementById("email").value.trim();
      if (!email) return;
      localStorage.setItem("arv_email", email);
      start();
    }

    function start() {
      const email = localStorage.getItem("arv_email");
      if (!email) return;
      const name = email.split('@')[0];
      document.getElementById("welcome").innerText = name;
      document.getElementById("profileName").innerText = name;
      document.getElementById("login").classList.remove("active");
      document.getElementById("home").classList.add("active");
      document.getElementById("bottom-nav").style.display = "flex";
      renderHome();
    }

    function renderHome() {
      const query = document.getElementById("globalSearch").value.trim().toLowerCase();
      const container = document.getElementById("sections-container");
      container.innerHTML = "";

      categories
        .filter(cat => activeFilter === "inicio" || cat.type === activeFilter || cat.id === "inicio")
        .forEach(cat => {
          const section = document.createElement("div");
          section.className = "section";
          section.innerHTML = `<div class="section-title">${cat.title}</div>`;
          const carousel = document.createElement("div");
          carousel.className = "carousel";

          (catalogByCategory[cat.id] || [])
            .filter(item => item.title.toLowerCase().includes(query))
            .forEach(item => {
              const card = document.createElement("div");
              card.className = "card";
              card.innerHTML = `
                ${safeImageTag(item)}
                <div class="card-options-btn" onclick='openSheet(${JSON.stringify(item)}, event)'>
                  <i data-lucide="more-vertical" size="16" color="white"></i>
                </div>
              `;
              card.addEventListener("click", () => openDetails(item));
              carousel.appendChild(card);
            });

          if (!carousel.children.length) {
            carousel.innerHTML = '<div class="card-placeholder" style="width:160px;aspect-ratio:2/3;">Nada encontrado</div>';
          }

          section.appendChild(carousel);
          container.appendChild(section);
        });

      lucide.createIcons();
    }

    function openDetails(item) {
      selectedItem = item;
      document.getElementById("detail-hero-img").src = item.img || "";
      document.getElementById("detail-hero-img").onerror = () => {
        document.getElementById("detail-hero-img").src = "https://picsum.photos/900/500?blur=1";
      };
      document.getElementById("detail-title").textContent = item.title;
      document.getElementById("episodeSearch").value = "";
      renderEpisodes(item);
      document.getElementById("detail-view").style.display = "block";
      lucide.createIcons();
    }

    function renderEpisodes(item) {
      const query = document.getElementById("episodeSearch").value.trim().toLowerCase();
      const epContainer = document.getElementById("episodes-container");
      epContainer.innerHTML = "";

      (episodeMapByItem[item.id] || [])
        .filter(ep => ep.title.toLowerCase().includes(query))
        .forEach((episode, index) => {
          const epThumb = `https://picsum.photos/seed/${item.id}-${index}/300/169`;
          const episodeCard = document.createElement("div");
          episodeCard.className = "episode-item";
          episodeCard.innerHTML = `
            <div class="ep-main">
              <div class="ep-thumb" onclick="openPlayer('${item.id}', '${episode.id}')">
                <img src="${epThumb}" alt="${episode.title}">
                <div class="ep-play-overlay"><i data-lucide="play" fill="white" size="24"></i></div>
              </div>
              <div class="ep-info">
                <div class="ep-title">${index + 1}. ${episode.title}</div>
                <div class="ep-meta">24 min</div>
              </div>
            </div>
          `;
          epContainer.appendChild(episodeCard);
        });

      if (!epContainer.children.length) {
        epContainer.innerHTML = '<p style="color:var(--muted);">Nenhum episódio encontrado.</p>';
      }
      lucide.createIcons();
    }

    function openPlayer(itemId, epId) {
      const episodes = episodeMapByItem[itemId] || [];
      const episode = episodes.find(ep => ep.id === epId);
      if (!episode) return;

      const player = document.getElementById("player");
      const video = document.getElementById("v-vid");
      video.src = episode.url;
      player.classList.add("active");
      video.play().catch(() => {});
    }

    function closePlayer() {
      const player = document.getElementById("player");
      const video = document.getElementById("v-vid");
      video.pause();
      video.currentTime = 0;
      player.classList.remove("active");
    }

    function closeDetails() {
      document.getElementById("detail-view").style.display = "none";
      closePlayer();
    }

    function logout() {
      localStorage.clear();
      location.reload();
    }

    function showScreen(id, el) {
      document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
      document.getElementById(id).classList.add("active");
      if (el) {
        document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
        el.classList.add("active");
      }
    }

    function toggleTheme() {
      document.body.classList.toggle("light");
    }

    function returnHome() {
      showScreen("home", document.querySelector(".nav-item"));
      closeDetails();
    }

    function toggleSearchBar() {
      const searchBar = document.getElementById("searchBar");
      searchBar.classList.toggle("is-open");
      if (!searchBar.classList.contains("is-open")) {
        document.getElementById("globalSearch").value = "";
        renderHome();
      }
    }

    function filterCatalogBySearch() {
      renderHome();
    }

    function filterEpisodes() {
      if (selectedItem) renderEpisodes(selectedItem);
    }

    function filterContent(type, el) {
      activeFilter = type;
      document.querySelectorAll(".filter").forEach(f => f.classList.remove("active"));
      el.classList.add("active");
      renderHome();
    }

    function openSheet(item, event) {
      event.stopPropagation();
      selectedItem = item;
      document.getElementById("sheetOverlay").style.display = "block";
      document.getElementById("sheet").classList.add("arv-sheet-active");
    }

    function closeSheet() {
      document.getElementById("sheetOverlay").style.display = "none";
      document.getElementById("sheet").classList.remove("arv-sheet-active");
    }

    buildEpisodeMap();
    start();
    lucide.createIcons();
  </script>
</body>
</html>
