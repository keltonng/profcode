<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARV | Plataforma</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root{
      --bg:#000;
      --card:#141414;
      --text:#fff;
      --muted:#9ca3af;
      --red:#e50914;
    }

    *{margin:0;padding:0;box-sizing:border-box;font-family:'Montserrat',sans-serif;}
    body{background:var(--bg);color:var(--text);padding-bottom:80px;}

    /* TELAS */
    .screen{display:none;min-height:100vh;}
    .screen.active{display:block;}

    /* LOGIN */
    .login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
    .login-box{width:100%;max-width:360px;background:rgba(20,20,20,.8);border-radius:16px;padding:24px;box-shadow:0 12px 40px rgba(0,0,0,.35);}
    .login-box h1{text-align:center;margin-bottom:18px;font-weight:900;}
    .login-box input{width:100%;padding:14px;margin-bottom:12px;background:#101010;border:1px solid #2c2c2c;border-radius:10px;color:#fff;}
    .login-box button{width:100%;padding:14px;background:var(--red);border:none;border-radius:10px;color:#fff;font-weight:800;cursor:pointer;}

    /* TOPO */
    .top{padding:20px 16px 10px;}
    .top h1{font-size:22px;font-weight:900;}
    .filters{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;}
    .filter{padding:8px 16px;border:1px solid #333;border-radius:20px;font-size:13px;cursor:pointer;color:#ccc;transition:.25s;}
    .filter.active{border-color:#fff;color:#fff;font-weight:700;}

    /* HERO */
    .hero{position:relative;height:240px;margin:10px 16px 30px;border-radius:18px;overflow:hidden;box-shadow:0 18px 36px rgba(0,0,0,.45);}
    .hero img{width:100%;height:100%;object-fit:cover;}
    .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,#000 20%,transparent);}
    .hero-info{position:absolute;bottom:20px;left:20px;}
    .hero-info h2{font-size:24px;font-weight:900;}
    .hero-info p{font-size:13px;color:#ccc;margin:6px 0;}
    .hero-info button{background:var(--red);border:none;padding:10px 18px;border-radius:6px;color:#fff;font-weight:800;cursor:pointer;}

    /* SEÇÕES */
    .section{padding:26px 0 18px 16px;}
    .section-title{font-size:20px;font-weight:900;margin-bottom:14px;}

    /* CAROUSEL */
    .carousel{display:flex;gap:16px;overflow-x:auto;}
    .carousel::-webkit-scrollbar{display:none;}

    /* CARD */
    .card{min-width:160px;height:240px;border-radius:14px;overflow:hidden;position:relative;cursor:pointer;transition:.3s;}
    .card:hover{transform:scale(1.05);box-shadow:0 20px 40px rgba(0,0,0,.6);}
    .card img{width:100%;height:100%;object-fit:cover;}
    .badge{position:absolute;bottom:10px;left:8px;background:var(--red);padding:4px 6px;font-size:11px;font-weight:700;border-radius:4px;}

    /* EPISÓDIOS */
    .episode{display:flex;gap:14px;background:var(--card);padding:12px;border-radius:12px;margin:10px 16px;cursor:pointer;}
    .episode img{width:110px;height:64px;border-radius:8px;object-fit:cover;}

    /* PERFIL */
    .profile{padding:30px;}
    .profile-header{display:flex;gap:16px;align-items:center;}
    .profile-header img{width:90px;height:90px;border-radius:50%;border:3px solid var(--red);object-fit:cover;}
    .profile-header h2{margin-bottom:4px;}
    .profile-btn{margin-top:14px;padding:16px;background:var(--card);border-radius:14px;cursor:pointer;color:var(--text);border:1px solid rgba(255,255,255,.05);}

    /* PLAYER */
    #player{position:fixed;inset:0;background:#000;display:none;z-index:999;} 
    #player video{width:100%;height:100%;object-fit:contain;} 
    #player span{position:absolute;top:20px;right:20px;font-size:26px;color:#fff;cursor:pointer;}

    /* RODAPÉ */
    .bottom{position:fixed;bottom:0;left:0;width:100%;height:70px;background:linear-gradient(180deg,rgba(20,20,20,.65),rgba(0,0,0,.9));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;justify-content:space-around;align-items:center;z-index:999;border-top:1px solid rgba(255,255,255,.05);}
    .nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:#9ca3af;cursor:pointer;transition:.25s;}
    .nav-item i{width:22px;height:22px;stroke-width:2;opacity:.85;}
    .nav-item.active{color:#fff;transform:scale(1.05);}
    .nav-item.active i{opacity:1;stroke:#fff;}
    .profile-pic{width:28px;height:28px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.3);}

    /* UTIL */
    .hidden{display:none;}

    /* BOTÃO HOME GLOBAL */
    .home-btn{position:fixed;right:16px;bottom:90px;z-index:1000;background:var(--red);color:#fff;border:none;padding:12px 14px;border-radius:12px;font-weight:800;box-shadow:0 12px 30px rgba(0,0,0,.45);cursor:pointer;display:flex;align-items:center;gap:8px;}
    .home-btn i{width:18px;height:18px;}
  </style>
</head>

<body>
  <!-- LOGIN -->
  <div id="login" class="screen active">
    <div class="login">
      <div class="login-box">
        <h1>Entrar no ARV</h1>
        <input id="name" placeholder="Seu nome" autocomplete="name">
        <input id="email" placeholder="Email" autocomplete="email">
        <button onclick="login()">Entrar</button>
      </div>
    </div>
  </div>

  <!-- HOME -->
  <div id="home" class="screen">
    <div class="top">
      <h1 id="welcome"></h1>
      <div class="filters">
        <div class="filter active" onclick="filterContent('all',this)">Início</div>
        <div class="filter" onclick="filterContent('series',this)">Séries</div>
        <div class="filter" onclick="filterContent('filmes',this)">Filmes</div>
        <div class="filter" onclick="filterContent('categorias',this)">Categorias</div>
      </div>
    </div>

    <div class="hero">
      <img src="https://i.imgur.com/0JpYpZK.jpg" alt="Destaque">
      <div class="hero-info">
        <h2>Só para você</h2>
        <p>Recomendado com base no seu perfil</p>
        <button onclick="openPlayer()">▶ Assistir</button>
      </div>
    </div>

    <div id="content"></div>
  </div>

  <!-- CLIPS / CONTINUAR -->
  <div id="clips" class="screen">
    <div class="top">
      <h1>Clips & Continuação</h1>
      <p class="filter" style="border-radius:12px;display:inline-flex;align-items:center;gap:6px;">Volte para qualquer episódio e continue de onde parou.</p>
    </div>
    <div id="clipsContent"></div>
  </div>

  <!-- PERFIL -->
  <div id="perfil" class="screen">
    <div class="profile">
      <div class="profile-header">
        <img id="avatar" src="https://i.imgur.com/6VBx3io.jpg" alt="Avatar" onclick="trocarFoto()">
        <div>
          <h2 id="profileName"></h2>
          <p>Membro Premium</p>
        </div>
      </div>

      <div class="profile-btn" onclick="trocarFoto()">Editar foto de perfil</div>
      <div class="profile-btn">Plano Premium</div>
      <div class="profile-btn">Termos de Uso</div>
      <div class="profile-btn" onclick="logout()">Sair</div>
    </div>
  </div>

  <!-- PLAYER -->
  <div id="player">
    <video controls autoplay>
      <source src="video-demo.mp4" type="video/mp4">
    </video>
    <span onclick="closePlayer()">✕</span>
  </div>

  <!-- RODAPÉ -->
  <div class="bottom" id="bottom">
    <div id="navHome" class="nav-item active" data-icon="home" onclick="go('home',this)">
      <i data-lucide="home"></i>
      <span>Início</span>
    </div>

    <div class="nav-item" data-icon="clapperboard" onclick="go('clips',this)">
      <i data-lucide="clapperboard"></i>
      <span>Clips</span>
    </div>

    <div class="nav-item" onclick="go('perfil',this)">
      <img class="profile-pic" id="avatarMini" src="https://i.imgur.com/6VBx3io.jpg" alt="Avatar mini">
      <span>Meu Perfil</span>
    </div>
  </div>

  <!-- INPUT DE UPLOAD -->
  <input type="file" id="uploadFoto" accept="image/*" hidden>

  <!-- BOTÃO GLOBAL PARA INÍCIO -->
  <button id="homeBtn" class="home-btn hidden" onclick="goHome()">
    <i data-lucide="home"></i>
    Início
  </button>

  <script>
    /* ===== DADOS ===== */
    const imagensSeries=[
      "imagens/01EBFB7A-B8A8-456E-8B95-A9267B1F51C9.png",
      "imagens/AB1AD796-C432-40A8-8A43-75589D76E9B8.png",
      "imagens/1FDBD744-36A8-492F.png"
    ];

    const imagensFilmes=[
      "imagens/23CBB367-FB29-4513.png",
      "imagens/2F7A1AF2-135E-40AE.png",
      "imagens/32850CDC-312F-4B4E.png"
    ];

    const imagensAnimes=[
      "imagens/434C7272-2212-4251.png",
      "imagens/476D7F40-F4C7-418C.png",
      "imagens/609255D5-4846-4FE7.png"
    ];

    const seriesCatalog=[
      {
        titulo:"Séries empolgantes",
        banner:"https://i.imgur.com/0JpYpZK.jpg",
        episodios:Array.from({length:6}).map((_,i)=>({
          numero:i+1,
          titulo:`Episódio ${i+1}`,
          descricao:"Continue assistindo de onde parou.",
          thumb:"https://i.imgur.com/9YcKZ3R.jpg"
        }))
      },
      {
        titulo:"Animes Shounen",
        banner:"https://i.imgur.com/zvX7y7n.jpg",
        episodios:Array.from({length:8}).map((_,i)=>({
          numero:i+1,
          titulo:`Capítulo ${i+1}`,
          descricao:"Pronto para voltar à ação?",
          thumb:"https://i.imgur.com/6YV1E1D.jpg"
        }))
      },
      {
        titulo:"Continuar assistindo",
        banner:"https://i.imgur.com/6YV1E1D.jpg",
        episodios:Array.from({length:5}).map((_,i)=>({
          numero:i+3,
          titulo:`Episódio ${i+3}`,
          descricao:"Retome imediatamente.",
          thumb:"https://i.imgur.com/0JpYpZK.jpg"
        }))
      }
    ];

    /* ===== LOGIN ===== */
    function login(){
      const name=document.getElementById("name").value.trim();
      if(!name) return;
      localStorage.setItem("arv_name",name);
      start();
    }

    function start(){
      const name=localStorage.getItem("arv_name");
      if(!name){
        show("login");
        return;
      }
      show("home");
      document.getElementById("welcome").innerText="Olá, "+name.split(" ")[0];
      document.getElementById("profileName").innerText=name.split(" ")[0];
      renderHome();
      renderClips();
    }

    function logout(){
      localStorage.clear();
      location.reload();
    }

    /* ===== HOME ===== */
    function renderHome(){
      const content=document.getElementById("content");
      content.innerHTML="";
      const sections=[
        {titulo:"Séries empolgantes",tipo:"series",imagens:imagensSeries},
        {titulo:"Continuar assistindo",tipo:"filmes",imagens:imagensFilmes},
        {titulo:"Animes Shounen",tipo:"series",imagens:imagensAnimes}
      ];

      sections.forEach(sec=>{
        const section=document.createElement("div");
        section.className="section";
        section.dataset.type=sec.tipo;
        section.innerHTML=`
          <div class="section-title">${sec.titulo}</div>
          <div class="carousel"></div>
        `;
        content.appendChild(section);
        montarCarousel(section.querySelector(".carousel"),sec.imagens);
      });
    }

    function renderClips(){
      const clipsContent=document.getElementById("clipsContent");
      clipsContent.innerHTML="";

      seriesCatalog.forEach(series=>{
        const section=document.createElement("div");
        section.className="section";
        section.innerHTML=`
          <div class="section-title">${series.titulo}</div>
        `;

        series.episodios.forEach(ep=>{
          const epEl=document.createElement("div");
          epEl.className="episode";
          epEl.innerHTML=`
            <img src="${ep.thumb}" alt="Thumb do ${ep.titulo}">
            <div>
              <h4>${series.titulo} — ${ep.titulo}</h4>
              <p>${ep.descricao}</p>
              <button class="filter" style="margin-top:8px" onclick="openPlayerFromClip('${series.titulo}','${ep.titulo}');event.stopPropagation();">Continuar episódio</button>
            </div>
          `;
          epEl.onclick=()=>openPlayerFromClip(series.titulo,ep.titulo);
          section.appendChild(epEl);
        });

        clipsContent.appendChild(section);
      });
    }

    function montarCarousel(carouselElement,imagens){
      carouselElement.innerHTML="";
      imagens.forEach(img=>{
        carouselElement.innerHTML+=`
          <div class="card" onclick="openEpisodes()">
            <img src="${img}" alt="Capa">
            <span class="badge">Novo</span>
          </div>
        `;
      });
    }

    function filterContent(type,el){
      document.querySelectorAll(".section").forEach(sec=>{
        sec.style.display=(type==="all"||type==="categorias"||sec.dataset.type===type)?"block":"none";
      });
      document.querySelectorAll(".filter").forEach(f=>f.classList.remove("active"));
      el.classList.add("active");
    }

    /* ===== EPISÓDIOS ===== */
    function openEpisodes(){
      const content=document.getElementById("content");
      content.innerHTML=`<div class="section"><div class="section-title">Episódios</div></div>`;
      for(let i=1;i<=10;i++){
        content.innerHTML+=`
          <div class="episode" onclick="openPlayer()">
            <img src="https://i.imgur.com/0JpYpZK.jpg" alt="Thumb episódio">
            <div>
              <h4>Episódio ${i}</h4>
              <p>Descrição do episódio ${i}</p>
            </div>
          </div>`;
      }
    }

    /* ===== PLAYER ===== */
    function openPlayerFromClip(seriesTitle,episodeTitle){
      const player=document.getElementById("player");
      player.dataset.current=`${seriesTitle} — ${episodeTitle}`;
      openPlayer();
    }

    function openPlayer(){document.getElementById("player").style.display="block";}
    function closePlayer(){document.getElementById("player").style.display="none";}

    /* ===== NAVEGAÇÃO ===== */
    function go(id,el){
      if(id==="clips") renderClips();
      show(id);
      document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));
      el.classList.add("active");
      updateIcons();
    }

    function show(id){
      document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
      document.getElementById(id).classList.add("active");
      const showNav=id!=="login";
      document.getElementById("bottom").style.display=showNav?"flex":"none";
      document.getElementById("homeBtn").classList.toggle("hidden",!showNav);
    }

    function goHome(){
      const homeNav=document.getElementById("navHome");
      if(homeNav){
        go("home",homeNav);
      }else{
        show("home");
      }
    }

    function updateIcons(){
      document.querySelectorAll(".nav-item").forEach(item=>{
        const icon=item.dataset.icon;
        if(!icon) return;
        const i=item.querySelector("i");
        i.setAttribute("data-lucide",item.classList.contains("active")?`${icon}-filled`:icon);
      });
      lucide.createIcons();
    }

    /* ===== FOTO DE PERFIL ===== */
    function trocarFoto(){document.getElementById("uploadFoto").click();}

    document.getElementById("uploadFoto").addEventListener("change",e=>{
      const file=e.target.files[0];
      if(!file) return;
      const reader=new FileReader();
      reader.onload=()=>{
        document.getElementById("avatar").src=reader.result;
        document.getElementById("avatarMini").src=reader.result;
        localStorage.setItem("arv_avatar",reader.result);
      };
      reader.readAsDataURL(file);
    });

    const savedAvatar=localStorage.getItem("arv_avatar");
    if(savedAvatar){
      document.getElementById("avatar").src=savedAvatar;
      document.getElementById("avatarMini").src=savedAvatar;
    }

    lucide.createIcons();
    start();
  </script>
</body>
</html>
