<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASD Academy</title>
  <style>
    :root {
      --bg: #050507;
      --surface: #111216;
      --text: #f4f4f6;
      --muted: #b8bcc8;
      --accent: #ffbf00;
      --card-border: #4a5577;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    .app {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
      background: #000;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      background: #0d0f14;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px;
      min-height: 84px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .topbar h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: .2px;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 50%;
      color: #fff;
      background: transparent;
      font-size: 28px;
      line-height: 1;
      cursor: pointer;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 18px;
    }

    .actions .next {
      border: 0;
      background: transparent;
      color: #fff;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
    }

    .page {
      padding: 20px 16px 36px;
    }

    .section {
      margin-bottom: 30px;
    }

    .section h2 {
      margin: 0 0 12px;
      font-size: 30px;
      line-height: 1.1;
      letter-spacing: .2px;
    }

    .cards-col,
    .cards-row {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 6px;
      scrollbar-width: thin;
    }

    .cards-col { flex-direction: column; overflow-x: visible; }

    .card {
      border: 2px solid var(--card-border);
      border-radius: 14px;
      overflow: hidden;
      background: #0a0c12;
      cursor: pointer;
      flex: 0 0 auto;
      width: 146px;
      height: 225px;
      position: relative;
      transition: transform .16s ease, border-color .2s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: #7f8ebb;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: brightness(.83);
    }

    .card .label {
      position: absolute;
      left: 10px;
      bottom: 10px;
      right: 10px;
      font-size: 21px;
      line-height: .95;
      font-weight: 900;
      text-transform: uppercase;
      text-shadow: 0 2px 18px rgba(0,0,0,.8);
    }

    .card .label small {
      color: var(--accent);
      display: block;
      margin-top: 2px;
    }

    .module-page { display: none; }

    .progress-ring {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: conic-gradient(#d9dde7 51%, #313543 0);
    }

    .progress-ring span {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 24px;
      font-weight: 800;
      background: #0d0f14;
      color: #fff;
    }

    .lesson-list { display: grid; gap: 12px; }

    .lesson {
      background: #07090d;
      border: 1px solid rgba(255,255,255,.08);
      display: grid;
      grid-template-columns: 106px 1fr;
      align-items: center;
      min-height: 88px;
      transition: border-color .16s;
    }

    .lesson:hover { border-color: rgba(255,255,255,.22); }

    .lesson img {
      width: 106px;
      height: 88px;
      object-fit: cover;
      filter: brightness(.72);
    }

    .lesson .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 10px;
    }

    .lesson .title {
      font-size: 18px;
      font-weight: 800;
      line-height: 1.2;
      margin: 0;
    }

    .play {
      border: 1px solid rgba(255,255,255,.2);
      background: rgba(255,255,255,.08);
      color: #fff;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      padding: 7px 12px;
      cursor: pointer;
      white-space: nowrap;
    }

    .video-panel {
      display: none;
      margin-top: 16px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.14);
      background: #040507;
    }

    .video-panel iframe,
    .video-panel video {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
      display: block;
      background: #000;
    }

    .video-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid rgba(255,255,255,.08);
      font-size: 14px;
      color: var(--muted);
    }

    .video-header strong { color: #fff; }

    .helper {
      color: var(--muted);
      font-size: 13px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="app">
    <section id="homePage">
      <header class="topbar">
        <button class="icon-btn" aria-label="Voltar">‹</button>
        <div class="actions">
          <span style="font-size:36px; line-height:0.6">⌕</span>
          <button class="next">Próxima aula →</button>
        </div>
      </header>

      <main class="page" id="sectionsRoot"></main>
    </section>

    <section id="modulePage" class="module-page">
      <header class="topbar">
        <div style="display:flex;align-items:center;gap:6px">
          <button id="backHome" class="icon-btn" aria-label="Voltar">‹</button>
          <h1 id="moduleTitle">Estrutura de Vendas</h1>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <button class="icon-btn" aria-label="Pesquisar">⌕</button>
          <div class="progress-ring"><span id="moduleProgress">51%</span></div>
        </div>
      </header>

      <main class="page">
        <div class="lesson-list" id="lessonList"></div>

        <section class="video-panel" id="videoPanel">
          <div class="video-header">
            <strong id="videoTitle">Aula selecionada</strong>
            <button class="play" id="closeVideo">Fechar vídeo</button>
          </div>
          <iframe
            id="videoFrame"
            src=""
            title="Player de aula"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen
          ></iframe>
          <video id="videoTag" controls style="display:none"></video>
        </section>

        <p class="helper">Agora cada aula possui vídeo. Para trocar, edite a propriedade <strong>video</strong> de cada item em <strong>COURSE_DATA</strong>.</p>
      </main>
    </section>
  </div>

  <script>
    const img = (seed) => `https://picsum.photos/seed/${seed}/600/900`;
    const yt = (id) => `https://www.youtube.com/embed/${id}`;

    const lessonsFromTitles = (titles, youtubeIds = []) => titles.map((title, index) => ({
      title,
      video: yt(youtubeIds[index] || "M7lc1UVf-VE")
    }));

    const COURSE_DATA = [
      {
        title: "clique aqui!",
        cards: [
          {
            id: "intro",
            title: "ASD",
            subtitle: "Boas-vindas",
            cover: img("asd-capa"),
            lessons: lessonsFromTitles(
              ["Apresentação da plataforma", "Como consumir as aulas", "Configuração inicial"],
              ["ysz5S6PUM-U", "aqz-KE-bpKQ", "ScMzIvxBSi4"]
            )
          }
        ]
      },
      {
        title: "Termos de Uso ⚠️",
        cards: [
          {
            id: "termos",
            title: "Leia antes",
            subtitle: "de usar!",
            cover: img("termos"),
            lessons: lessonsFromTitles(
              ["Regras de acesso", "Política de conteúdo", "Dúvidas e suporte"],
              ["M7lc1UVf-VE", "5qap5aO4i9A", "dQw4w9WgXcQ"]
            )
          }
        ]
      },
      {
        title: "Aplicativo ASD!",
        cards: [
          {
            id: "trafego",
            title: "Tráfego",
            subtitle: "Pago",
            cover: img("trafego-pago"),
            lessons: lessonsFromTitles(
              ["Estrutura de campanha", "Criativos e testes", "Otimização diária"],
              ["ysz5S6PUM-U", "aqz-KE-bpKQ", "ScMzIvxBSi4"]
            )
          }
        ]
      },
      {
        title: "Estrutura de Vendas",
        cards: [
          {
            id: "estrutura",
            title: "Estrutura",
            subtitle: "Perfil Dark",
            cover: img("estrutura-dark"),
            lessons: lessonsFromTitles(
              [
                "Aula 1 - O Primeiro Contato",
                "Aula 2 - Montagem do Perfil",
                "Aula 3 - Link da Bio",
                "Aula 4 - Página de Vendas / Checkout",
                "Aula 5 - Suporte Adequado",
                "Aula 6 - LTV"
              ],
              ["M7lc1UVf-VE", "ysz5S6PUM-U", "aqz-KE-bpKQ", "ScMzIvxBSi4", "dQw4w9WgXcQ", "5qap5aO4i9A"]
            )
          }
        ]
      },
      {
        title: "Edição",
        cards: [
          {
            id: "edicao",
            title: "Edição",
            subtitle: "Viral",
            cover: img("edicao-viral"),
            lessons: lessonsFromTitles(
              [
                "Iniciando o projeto & adicionando áudio",
                "Cortes & sincronização",
                "Texto & transições",
                "Filtro + presets",
                "CapCut - Exportação ilimitada",
                "Posts com Textos Dinâmicos"
              ],
              ["ysz5S6PUM-U", "aqz-KE-bpKQ", "ScMzIvxBSi4", "M7lc1UVf-VE", "dQw4w9WgXcQ", "5qap5aO4i9A"]
            )
          }
        ]
      },
      {
        title: "Pacotes de Vídeos",
        row: true,
        cards: [
          {
            id: "lifestyle",
            title: "Lifestyle",
            subtitle: "Variado",
            cover: img("lifestyle"),
            lessons: lessonsFromTitles(["Pacote 01", "Pacote 02", "Pacote 03"], ["M7lc1UVf-VE", "ysz5S6PUM-U", "aqz-KE-bpKQ"])
          },
          {
            id: "dinheiro",
            title: "Dinheiro",
            subtitle: "e Luxo",
            cover: img("dinheiro"),
            lessons: lessonsFromTitles(["Pacote 01", "Pacote 02", "Pacote 03"], ["ScMzIvxBSi4", "dQw4w9WgXcQ", "5qap5aO4i9A"])
          },
          {
            id: "motivacao",
            title: "Motivação",
            subtitle: "e Foco",
            cover: img("motivacao"),
            lessons: lessonsFromTitles(["Pacote 01", "Pacote 02", "Pacote 03"], ["aqz-KE-bpKQ", "M7lc1UVf-VE", "ysz5S6PUM-U"])
          }
        ]
      }
    ];

    const sectionsRoot = document.getElementById("sectionsRoot");
    const homePage = document.getElementById("homePage");
    const modulePage = document.getElementById("modulePage");
    const lessonList = document.getElementById("lessonList");
    const moduleTitle = document.getElementById("moduleTitle");
    const backHome = document.getElementById("backHome");
    const videoPanel = document.getElementById("videoPanel");
    const videoTitle = document.getElementById("videoTitle");
    const videoFrame = document.getElementById("videoFrame");
    const videoTag = document.getElementById("videoTag");
    const closeVideo = document.getElementById("closeVideo");

    function renderHome() {
      sectionsRoot.innerHTML = "";
      COURSE_DATA.forEach(section => {
        const wrapper = document.createElement("section");
        wrapper.className = "section";

        const h2 = document.createElement("h2");
        h2.textContent = section.title;
        wrapper.appendChild(h2);

        const list = document.createElement("div");
        list.className = section.row ? "cards-row" : "cards-col";

        section.cards.forEach(card => {
          const el = document.createElement("button");
          el.className = "card";
          el.innerHTML = `
            <img src="${card.cover}" alt="${card.title}" />
            <span class="label">${card.title}<small>${card.subtitle}</small></span>
          `;
          el.addEventListener("click", () => openModule(card));
          list.appendChild(el);
        });

        wrapper.appendChild(list);
        sectionsRoot.appendChild(wrapper);
      });
    }

    function playLesson(lesson) {
      videoPanel.style.display = "block";
      videoTitle.textContent = lesson.title;

      const isEmbed = lesson.video.includes("youtube.com/embed");
      if (isEmbed) {
        videoFrame.style.display = "block";
        videoTag.style.display = "none";
        videoTag.pause();
        videoTag.removeAttribute("src");
        videoFrame.src = lesson.video;
      } else {
        videoFrame.style.display = "none";
        videoFrame.src = "";
        videoTag.style.display = "block";
        videoTag.src = lesson.video;
        videoTag.load();
      }
    }

    function resetVideoPlayer() {
      videoFrame.src = "";
      videoTag.pause();
      videoTag.removeAttribute("src");
      videoPanel.style.display = "none";
    }

    function openModule(card) {
      moduleTitle.textContent = card.id === "edicao" ? "Aulas de edição no Capcut" :
        card.id === "estrutura" ? "Estrutura de Vendas" :
          card.id === "intro" ? "Módulo de Introdução" :
            card.id === "termos" ? "Termos e Condições" :
              card.id === "trafego" ? "Aplicativo ASD" :
                card.title;

      lessonList.innerHTML = "";
      card.lessons.forEach((lesson, i) => {
        const item = document.createElement("article");
        item.className = "lesson";
        item.innerHTML = `
          <img src="${i === 4 && card.id === "edicao" ? img("capcut-export") : card.cover}" alt="${lesson.title}" />
          <div class="meta">
            <p class="title">${lesson.title}</p>
            <button class="play" type="button">Assistir</button>
          </div>
        `;

        item.querySelector(".play").addEventListener("click", (event) => {
          event.stopPropagation();
          playLesson(lesson);
        });

        item.addEventListener("click", () => playLesson(lesson));
        lessonList.appendChild(item);
      });

      resetVideoPlayer();
      homePage.style.display = "none";
      modulePage.style.display = "block";
    }

    closeVideo.addEventListener("click", () => resetVideoPlayer());

    backHome.addEventListener("click", () => {
      resetVideoPlayer();
      modulePage.style.display = "none";
      homePage.style.display = "block";
    });

    renderHome();
  </script>
</body>
</html>
